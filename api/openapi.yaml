
openapi: 3.0.3

info:
  title: CServer Manager API
  version: 0.1.0-dev
  description: |
    HTTP API for CServer Manager.

    The API provides application information and read-only CS2
    server discovery, including optional OverlayFS and systemd
    mount-unit configuration metadata.

    Configuration evidence does not prove runtime activity.
    Docker, mount and systemd runtime states are not inspected.

    Server lifecycle operations are not available.

servers:
  - url: http://127.0.0.1:8080
    description: Default local development server

tags:
  - name: System
    description: Application health and metadata
  - name: Servers
    description: Read-only CS2 server discovery

paths:
  /healthz:
    get:
      tags:
        - System
      summary: Get application health
      operationId: getHealth
      description: |
        Returns the HTTP application's health status.
        This does not verify Docker or CS2 server health.
      responses:
        "200":
          description: Application is responding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /api/v1/info:
    get:
      tags:
        - System
      summary: Get application information
      operationId: getApplicationInfo
      description: Returns application name and version.
      responses:
        "200":
          description: Application information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationInfo"
              example:
                name: CServer Manager
                version: 0.1.0-dev
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /api/v1/servers:
    get:
      tags:
        - Servers
      summary: Discover existing CS2 server instances
      operationId: listServers
      description: |
        Returns CS2 instances found under the configured
        CSERVER_ROOT directory.

        Optional infrastructure configuration can be discovered
        from external OverlayFS and systemd unit directories.

        The existing discovery status values describe basic
        configuration completeness, not runtime health.

        The optional infrastructure field contains configuration
        evidence and safe diagnostics only. Its absence does not
        imply that infrastructure is inactive or unmounted.

        A runtime_state value of not_checked means that no
        runtime inspection has been performed.

        Sensitive environment variables, arbitrary mount options
        and raw unit contents are not returned.

        This endpoint does not start, stop or modify servers.
      responses:
        "200":
          description: Discovery completed successfully
          headers:
            Cache-Control:
              description: Prevent caching local inventory data
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServersResponse"
              example:
                servers:
                  - id: aim
                    name: AIM Server
                    directory: /example/servers/aim
                    status: complete
                    compose_file: /example/servers/aim/compose.yaml
                    env_file: /example/servers/aim/.env
                    port: 27018
                    evidence:
                      - env
                      - compose
                    infrastructure:
                      overlayfs:
                        lower_directories:
                          - /example/servers/base/data
                        upper_directory: /example/overlay/aim/upper
                        work_directory: /example/overlay/aim/work
                        merged_directory: /example/servers/aim/merged
                        source: filesystem_and_systemd_unit
                        runtime_state: not_checked
                      systemd:
                        unit_name: example-aim.mount
                        unit_file: /example/units/example-aim.mount
                        where: /example/servers/aim/merged
                        runtime_state: not_checked
                count: 1
        "503":
          description: Discovery is not configured or unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notConfigured:
                  summary: Discovery root is not configured
                  value:
                    error: discovery_not_configured
                unavailable:
                  summary: Discovery service is unavailable
                  value:
                    error: discovery_unavailable
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
      additionalProperties: false

    ApplicationInfo:
      type: object
      required:
        - name
        - version
      properties:
        name:
          type: string
          example: CServer Manager
        version:
          type: string
          example: 0.1.0-dev
      additionalProperties: false

    DiscoveryWarning:
      type: object
      description: Safe, non-secret discovery diagnostic
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: incomplete_configuration
        message:
          type: string
          example: Both .env and a Compose file are required
      additionalProperties: false

    RuntimeInspectionState:
      type: string
      description: |
        Runtime inspection state.

        The only supported value is not_checked because this
        release does not inspect active mounts, running units,
        Docker containers or CS2 server health.
      enum:
        - not_checked

    OverlayFSMetadata:
      type: object
      description: |
        OverlayFS configuration evidence.

        Paths may originate from existing directories or systemd
        mount-unit declarations. Their presence in this object
        does not establish mount activation or runtime validity.
      required:
        - source
        - runtime_state
      properties:
        lower_directories:
          type: array
          description: Lower-layer directories declared by a mount unit
          items:
            type: string
          example:
            - /example/servers/base/data

        upper_directory:
          type: string
          description: |
            Detected or declared upper directory path.
          example: /example/overlay/aim/upper

        work_directory:
          type: string
          description: |
            Detected or declared work directory path.
          example: /example/overlay/aim/work

        merged_directory:
          type: string
          description: |
            Detected or declared merged mount destination.
            This does not prove the destination is mounted.
          example: /example/servers/aim/merged

        source:
          type: string
          description: Origin of configuration evidence
          enum:
            - filesystem
            - systemd_unit
            - filesystem_and_systemd_unit

        runtime_state:
          $ref: "#/components/schemas/RuntimeInspectionState"
      additionalProperties: false

    SystemdMountMetadata:
      type: object
      description: |
        Recognized systemd overlay mount-unit configuration.

        No systemd runtime state or enablement information is
        retrieved. Unit names are retained from discovered files.
      required:
        - unit_name
        - unit_file
        - where
        - runtime_state
      properties:
        unit_name:
          type: string
          description: Mount-unit filename
          example: example-aim.mount

        unit_file:
          type: string
          description: Absolute source unit-file path
          example: /example/units/example-aim.mount

        where:
          type: string
          description: Mount destination declared by the unit
          example: /example/servers/aim/merged

        runtime_state:
          $ref: "#/components/schemas/RuntimeInspectionState"
      additionalProperties: false

    InfrastructureMetadata:
      type: object
      description: |
        Optional infrastructure configuration metadata.

        This object may include OverlayFS information, systemd
        mount-unit information, warnings, or a combination.

        A warnings-only object is valid when configured
        infrastructure sources cannot be inspected.

        Missing metadata must never be interpreted as stopped,
        inactive or unmounted infrastructure.
      minProperties: 1
      properties:
        overlayfs:
          $ref: "#/components/schemas/OverlayFSMetadata"

        systemd:
          $ref: "#/components/schemas/SystemdMountMetadata"

        warnings:
          type: array
          items:
            $ref: "#/components/schemas/DiscoveryWarning"
      additionalProperties: false

    DiscoveredServer:
      type: object
      description: |
        Filesystem inventory record.

        Status describes basic configuration completeness.
        Infrastructure metadata is optional and reports only
        evidence from configured read-only sources.
      required:
        - id
        - name
        - directory
        - status
        - evidence
      properties:
        id:
          type: string
          example: aim

        name:
          type: string
          example: AIM Server

        directory:
          type: string
          description: Absolute instance directory

        status:
          type: string
          enum:
            - complete
            - incomplete

        compose_file:
          type: string
          description: Detected Compose file path

        env_file:
          type: string
          description: Detected environment file path

        merged_directory:
          type: string
          description: |
            Merged directory detected by the basic filesystem
            scanner. This does not prove an active mount.

        port:
          type: integer
          minimum: 1
          maximum: 65535
          example: 27018

        evidence:
          type: array
          items:
            type: string
          example:
            - env
            - compose

        warnings:
          type: array
          items:
            $ref: "#/components/schemas/DiscoveryWarning"

        infrastructure:
          $ref: "#/components/schemas/InfrastructureMetadata"
      additionalProperties: false

    ServersResponse:
      type: object
      required:
        - servers
        - count
      properties:
        servers:
          type: array
          items:
            $ref: "#/components/schemas/DiscoveredServer"

        count:
          type: integer
          minimum: 0
          example: 1
      additionalProperties: false

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          enum:
            - discovery_not_configured
            - discovery_unavailable
      additionalProperties: false

  responses:
    MethodNotAllowed:
      description: HTTP method is not supported for this resource
      headers:
        Allow:
          description: Allowed HTTP methods
          schema:
            type: string
            example: GET, HEAD
